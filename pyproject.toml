[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "photography-viewpoint-agent"
version = "0.3.0"
requires-python = ">=3.11"
dynamic = ["dependencies"]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.setuptools.packages.find]
include = ["photography_viewpoint_agent*", "video_guide*"]

[project.scripts]
photo-agent = "photography_viewpoint_agent.app:main"
video-guide = "video_guide.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[project.optional-dependencies]
web = ["fastapi>=0.110", "uvicorn>=0.27", "python-multipart>=0.0.9"]
test = ["httpx>=0.27", "pytest>=8,<10"]

[tool.setuptools.package-data]
video_guide = ["static/*.html", "static/*.css", "static/*.js"]
